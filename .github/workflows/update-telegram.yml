name: Update Telegram regions

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_telegram.py'
      - 'tests/test_telegram.py'
      - '.github/workflows/update-telegram.yml'

permissions:
  contents: write

concurrency:
  group: telegram-region-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test failure protection and region partitioning
        run: python -m unittest discover -s tests -v
      - name: Fetch, validate and generate all regions
        run: python scripts/update_telegram.py
      - name: Publish only changed rule files
        shell: bash
        run: |
          set -euo pipefail
          git add -- rules/TelegramSG.list rules/TelegramUS.list rules/TelegramEU.list
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Telegram region rules'
          git push origin HEAD:main
